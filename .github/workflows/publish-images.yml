name: Publish images to GHCR

# Builds and pushes the backend and web-client images to GitHub Container Registry.
# - push to main      -> :main and :latest (+ :sha-xxxxxxx)
# - push a vX.Y.Z tag -> :X.Y.Z, :X.Y, :latest, and a GitHub Release (below)
# - manual run        -> via the Actions tab (workflow_dispatch)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr requires a lowercase path; hardcoded to avoid repo-name casing issues.
  IMAGE_BASE: ghcr.io/spillers-technology/anchordesk

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: web-client
            context: ./web-client
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Only fires on a vX.Y.Z tag, and only after both images have actually
  # published — a Release implies "this was built and shipped," not just
  # "someone pushed a tag." Manual workflow_dispatch runs and plain pushes to
  # main are on a branch ref, not a tag ref, so they skip this job entirely.
  create-release:
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTES_FILE="RELEASE_NOTES_v${VERSION}.md"

          if [ -f "$NOTES_FILE" ]; then
            # The release-notes file's own H1 is the title we've always used
            # by hand (e.g. "AnchorDesk 2.8.0 — Access & Signal"); strip the
            # leading "# " and the trailing "(minor|major|patch)" tag so the
            # generated title matches every release created before this
            # automation existed.
            TITLE="$(sed -n '1s/^# *//p' "$NOTES_FILE" | sed -E 's/ \((major|minor|patch)\)$//')"
            gh release create "$TAG" \
              --title "${TITLE:-AnchorDesk $TAG}" \
              --notes-file "$NOTES_FILE" \
              --latest
          else
            # A tag pushed without a matching RELEASE_NOTES_vX.Y.Z.md still
            # gets a Release — auto-generated notes beat no Release at all,
            # and this is exactly the gap that let 2.7.1/2.7.2 ship with
            # published images but no Release object.
            echo "::warning::No $NOTES_FILE found; falling back to auto-generated notes."
            gh release create "$TAG" \
              --title "AnchorDesk $TAG" \
              --generate-notes \
              --latest
          fi
